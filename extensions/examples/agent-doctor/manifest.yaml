name: agent-doctor
version: 0.4.0
title: Agent Doctor
description: Review an agent's harness setup — system prompt, memory, skills, MCP, loops — with per-tool adapters (claude/codex).
# Standard view extension: index.html (iframe view, bridge-only data) +
# main.py (SPEC v2 type-B remote collector). Fully updatable by
# installing a same-name package — no app release needed.
# No declared attributes: the app Settings page shows only the platform's
# uniform show_in_agent_menu toggle. Its custom config (prompt_warn_kb)
# is self-managed — read via ext.config and surfaced on its own page.
capabilities:
  - exec

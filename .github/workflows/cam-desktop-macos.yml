name: CAM Desktop — macOS DMG

# Signed + notarized when the Apple secrets are configured, unsigned
# POC otherwise. Secrets (repo Settings → Secrets and variables →
# Actions): CSC_LINK (base64 .p12 of the Developer ID Application cert),
# CSC_KEY_PASSWORD, APPLE_API_KEY (.p8 file contents),
# APPLE_API_KEY_ID, APPLE_API_ISSUER, TEAM_ID. On tag pushes the DMG is
# also attached to the GitHub Release for the tag.

on:
  workflow_dispatch:
  push:
    tags:
      - 'cam-desktop-v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-dmg:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
    defaults:
      run:
        working-directory: apps/cam-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/cam-desktop/package-lock.json

      - name: Decide signing mode
        env:
          HAS_CERT: ${{ secrets.CSC_LINK }}
        run: |
          if [ -n "$HAS_CERT" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Syntax check Electron entrypoints
        run: npm run lint:electron

      - name: Build DMG (signed + notarized when secrets present)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          EXTRA=""
          if [ "$CSC_IDENTITY_AUTO_DISCOVERY" = "true" ]; then
            EXTRA="--config.mac.notarize=true"
            if [ -n "$APPLE_API_KEY_CONTENT" ]; then
              printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            fi
          fi
          npx electron-builder --mac dmg --${{ matrix.arch }} --config.npmRebuild=false --publish=never $EXTRA

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: cam-desktop-macos-${{ matrix.arch }}-dmg
          path: |
            apps/cam-desktop/dist/*.dmg
            apps/cam-desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "CAM Desktop ${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Skills</title>
<style>
/* Self-contained ext view (no app CSS reaches the iframe). Palette mirrors
 * the assistant view; skills-* styles are ported from desktop.css with the
 * app's variables mapped onto the local ones. */
:root { --bg:#0f1216; --panel:#161b22; --card:#11161c; --line:#2d333b; --fg:#e6e8eb; --dim:#8b949e; --muted:#6e7681; --accent:#1f6feb; --accent-hi:#388bfd; --err:#f85149; --ok:#3fb950; }
* { box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px 16px; background: var(--bg); color: var(--fg); font-size: 13px; }
[hidden] { display: none !important; }
.empty-state { color: var(--dim); font-size: 12px; padding: 14px; text-align: center; }
.form-hint { color: var(--dim); font-size: 11px; margin: 4px 0 0; }

.skills-workbench { width: 100%; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.skills-card { min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.skills-card h3 { margin: 0; font-size: 13px; font-weight: 650; }
.skills-card h4 { margin: 0 0 6px; font-size: 12px; font-weight: 650; color: var(--fg); }
.skills-card label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 12px; }
.skills-card input, .skills-card select { background: var(--card); border: 1px solid var(--line); color: var(--fg); padding: 6px 8px; border-radius: 6px; font: inherit; }
.skills-card input:focus, .skills-card select:focus { outline: 1px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.skills-card-head, .skills-actions, .skills-mini-actions { display: flex; align-items: center; gap: 8px; }
.skills-card-head { justify-content: space-between; }
.skills-actions { flex-wrap: wrap; }
.skills-inline-fields { display: grid; grid-template-columns: minmax(120px, 180px) minmax(0, 1fr); gap: 8px; }

.btn-primary, .btn-secondary { border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 12px; padding: 6px 10px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hi); }
.btn-secondary { background: var(--card); color: var(--fg); }
.btn-secondary:hover:not(:disabled) { background: var(--line); }
.btn-primary:disabled, .btn-secondary:disabled { cursor: not-allowed; opacity: 0.55; }
.btn-danger-lite { border-color: rgba(248,113,113,.45); color: #fecaca; }
.btn-danger-lite:hover:not(:disabled) { background: rgba(248,113,113,.12); }

.skills-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.skills-tab { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--dim); padding: 6px 12px; font-size: 13px; cursor: pointer; }
.skills-tab.active { color: var(--fg); border-bottom-color: var(--accent); }
.skills-tab:hover { color: var(--fg); }
.skills-tab-panel { margin-top: 10px; }
.skills-setup-grid { display: grid; grid-template-columns: minmax(220px, 0.8fr) minmax(0, 1.2fr); gap: 12px; }
.skills-subpanel { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--card); }
.skills-subpanel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.skills-subpanel-head h4 { margin: 0; }
.skills-install-controls { display: grid; grid-template-columns: minmax(160px, 220px) minmax(0, 1fr); gap: 10px; margin-bottom: 8px; }
.skills-install-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 10px; }
.skills-segmented { display: flex; gap: 4px; margin-bottom: 8px; }
.skills-segmented button { background: var(--card); border: 1px solid var(--line); color: var(--dim); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.skills-segmented button.active { color: var(--fg); border-color: var(--accent); background: var(--panel); }
.skills-agent-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
.skills-agent-grid label { flex-direction: row !important; align-items: center; gap: 6px; color: var(--fg); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
.skills-agent-grid input { padding: 0; }

.skillm-repo-list, .skillm-node-list, .skillm-skill-list { border: 1px solid var(--line); border-radius: 6px; background: var(--card); overflow: auto; min-height: 96px; }
.skillm-repo-list { max-height: 340px; }
.skillm-node-list { max-height: 240px; }
.skillm-skill-list { min-height: 260px; max-height: 440px; }
.skillm-repo-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.skillm-repo-row:last-child, .skillm-node-row:last-child, .skillm-skill-row:last-child { border-bottom: 0; }
.skillm-repo-row:hover, .skillm-node-row:hover, .skillm-skill-row:hover { background: var(--panel); }
.skillm-repo-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; min-width: 0; }
.skillm-repo-name { font-weight: 650; font-size: 13px; }
.skillm-repo-url { color: var(--muted); font-family: SFMono-Regular, Consolas, monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.skillm-repo-badge { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; padding: 1px 6px; border-radius: 10px; background: rgba(70,149,74,.28); color: #cfead2; border: 1px solid rgba(70,149,74,.6); }
.skillm-repo-actions { display: flex; gap: 4px; flex-shrink: 0; }
.skillm-repo-editor { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; background: var(--card); }

.skillm-node-row, .skillm-skill-row { display: grid; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.skillm-node-row { grid-template-columns: auto minmax(0, 1fr) minmax(110px, 0.7fr); }
.skillm-skill-row { grid-template-columns: auto minmax(0, 1.1fr) minmax(80px, 0.8fr) minmax(80px, auto); }
.skillm-node-row.is-disabled { opacity: 0.55; }
.skillm-node-main, .skillm-skill-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.skillm-node-name, .skillm-skill-name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skillm-node-meta, .skillm-node-path, .skillm-skill-full, .skillm-skill-meta { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skillm-node-path, .skillm-skill-meta { text-align: right; font-variant-numeric: tabular-nums; }
.skillm-skill-tags { display: flex; gap: 4px; flex-wrap: wrap; min-width: 0; }
.skillm-skill-tags span { padding: 1px 5px; border: 1px solid var(--line); border-radius: 6px; color: var(--dim); background: var(--card); font-size: 11px; }

.skills-status { min-height: 18px; font-size: 12px; padding: 8px 2px 0; color: var(--dim); }
.skills-status.is-ok { color: var(--ok); }
.skills-status.is-error { color: var(--err); }
</style>
</head>
<body>
<!-- Markup ported 1:1 from the retired native #mode-skills section
     (web/desktop.html); the page header (title/Back) is app chrome. -->
<div class="skills-workbench">
  <section class="skills-card skills-card-main">
    <div class="skills-tabs" role="tablist" aria-label="Skills workspace tabs">
      <button type="button" class="skills-tab active" data-skillm-tab="repos" role="tab" aria-selected="true">Repositories</button>
      <button type="button" class="skills-tab" data-skillm-tab="install" role="tab" aria-selected="false">Install</button>
    </div>

    <div class="skills-tab-panel" id="skillm-tab-repos">
      <div class="skills-card-head">
        <h3>Setup and repositories</h3>
        <button type="button" class="btn-primary" id="skillm-repo-add">Add Repository</button>
      </div>
      <div class="skills-setup-grid">
        <section class="skills-subpanel skills-setup-panel">
          <div class="skills-subpanel-head">
            <h4>Setup node</h4>
            <div class="skills-mini-actions">
              <button type="button" class="btn-secondary" id="skillm-check">Check</button>
              <button type="button" class="btn-secondary" id="skillm-refresh">Refresh</button>
            </div>
          </div>
          <label>Node
            <select id="skillm-setup-context"></select>
          </label>
          <p class="form-hint">Choose the node that owns the Skillm repository store. Install can target this node, all SSH nodes, or selected nodes.</p>
        </section>

        <section class="skills-subpanel skills-repo-panel">
          <div class="skills-repo-editor" id="skillm-repo-editor" hidden>
            <div class="skills-inline-fields">
              <label>Name
                <input type="text" id="skillm-repo-name" placeholder="main" autocomplete="off">
              </label>
              <label>Git repo URL
                <input type="url" id="skillm-repo-url" placeholder="https://gitlab.example.com/team/skills.git" autocomplete="off">
              </label>
            </div>
            <label>Token
              <input type="password" id="skillm-repo-token" placeholder="one-shot token, not saved" autocomplete="off">
            </label>
            <div class="skills-actions">
              <button type="button" class="btn-primary" id="skillm-repo-save">Save Repository</button>
              <button type="button" class="btn-secondary" id="skillm-repo-cancel">Cancel</button>
            </div>
          </div>
          <div class="skillm-repo-list" id="skillm-repo-list"></div>
        </section>
      </div>
    </div>

    <div class="skills-tab-panel" id="skillm-tab-install" hidden>
      <div class="skills-card-head">
        <h3>Install skills</h3>
        <div class="skills-mini-actions">
          <button type="button" class="btn-secondary" id="skillm-skills-all">Select shown</button>
          <button type="button" class="btn-secondary" id="skillm-skills-none">Clear</button>
        </div>
      </div>
      <div class="skills-install-controls">
        <label>Repository
          <select id="skillm-repo-filter"><option value="all">All repositories</option></select>
        </label>
        <label>Search
          <input type="search" id="skillm-skill-search" placeholder="Search name, tag, repo..." autocomplete="off">
        </label>
      </div>
      <div class="skillm-skill-list" id="skillm-skill-list"></div>

      <div class="skills-install-grid">
        <section class="skills-subpanel">
          <h4>Target hosts</h4>
          <div class="skills-segmented" role="group" aria-label="Node scope">
            <button type="button" class="active" data-node-scope="setup">This node</button>
            <button type="button" data-node-scope="all">All SSH</button>
            <button type="button" data-node-scope="selected">Selected</button>
          </div>
          <div class="skillm-node-list" id="skillm-node-list"></div>
        </section>
        <section class="skills-subpanel">
          <h4>Install target</h4>
          <label>Scope
            <select id="skillm-install-scope">
              <option value="global">Global defaults</option>
              <option value="workspace">Workspace path</option>
            </select>
          </label>
          <label>Workspace path
            <input type="text" id="skillm-workspace-path" placeholder="/path/to/workspace" autocomplete="off">
          </label>
          <div class="skills-agent-grid" aria-label="Agent CLIs">
            <label><input type="checkbox" id="skillm-agent-claude" checked> Claude</label>
            <label><input type="checkbox" id="skillm-agent-codex" checked> Codex</label>
            <label><input type="checkbox" id="skillm-agent-agents" checked> Agents (common)</label>
            <label><input type="checkbox" id="skillm-agent-cursor" checked> Cursor</label>
          </div>
          <div class="skills-actions">
            <button type="button" class="btn-primary" id="skillm-install">Install selected skills</button>
          </div>
        </section>
      </div>
    </div>
  </section>
</div>

<div class="settings-status skills-status" id="skillm-status" aria-live="polite"></div>

<script src="../client.js"></script>
<script>
/* Sandboxed ext views run in an opaque origin — window.localStorage throws
 * there. In-memory shim: repo name/url persistence is a form convenience,
 * not data (the durable state lives in skillm on the node). */
(() => {
  const mem = new Map();
  Object.defineProperty(window, 'localStorage', { get: () => ({
    getItem: (k) => (mem.has(k) ? mem.get(k) : null),
    setItem: (k, v) => mem.set(k, String(v)),
    removeItem: (k) => mem.delete(k),
  }) });
})();
</script>
<script>
'use strict';
/* Logic ported 1:1 from the retired web/js/desktop/skills-mode.js — only
 * the API layer changed: api.skillm* → camExt.hubCall (hub:api
 * capability), state.get('contexts') → contexts.list bridge read,
 * showToast → status line. Repository refresh still happens hub-side
 * before list/install; there is no separate Sync tab/action. */

const AGENT_TOOLS = ['claude', 'codex', 'agents', 'cursor'];
const REPO_NAME_KEY = 'cam_desktop_skillm_repo_name';
const REPO_URL_KEY  = 'cam_desktop_skillm_repo_url';

const enc = encodeURIComponent;
const api = {
  skillmStatus: (c) => camExt.hubCall('GET', `/api/skillm/status?context=${enc(c || '')}`),
  skillmRepos: (c) => camExt.hubCall('GET', `/api/skillm/repos?context=${enc(c || '')}`),
  skillmList: (c, opts = {}) => {
    const qs = new URLSearchParams({ context: c || '' });
    if (opts.repoName) qs.set('repo', opts.repoName);
    if (opts.sync) qs.set('sync', '1');
    return camExt.hubCall('GET', `/api/skillm/list?${qs.toString()}`);
  },
  skillmRepoAdd: (b) => camExt.hubCall('POST', '/api/skillm/repos', b),
  skillmRepoUpdate: (b) => camExt.hubCall('PATCH', '/api/skillm/repos', b),
  skillmRepoRemove: (b) => camExt.hubCall('DELETE', '/api/skillm/repos', b),
  skillmRepoRefresh: (b) => camExt.hubCall('POST', '/api/skillm/repos/refresh', b),
  skillmInstall: (b) => camExt.hubCall('POST', '/api/skillm/install', b),
};

/* state shim: contexts come from the contexts.list bridge read; the view
 * is reloaded on every open (iframe cache-bust), and Refresh re-reads. */
let _contexts = [];
let _connected = false;
const state = {
  get: (k) => {
    if (k === 'contexts') return _contexts;
    if (k === 'connectionMode') return _connected ? 'direct' : 'disconnected';
    return undefined;
  },
};
</script>
<script>

/* ── ported page logic (1:1 from skills-mode.js) ── */
function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

function machineLabel(ctx) {
  const m = (ctx && ctx.machine) || {};
  if ((m.type || 'local') === 'ssh') {
    const host = m.host || 'ssh-host';
    const user = m.user ? `${m.user}@` : '';
    const port = m.port || 22;
    return `${ctx.name} - ${user}${host}:${port}`;
  }
  return `${ctx && ctx.name || 'local'} - local`;
}

function isSshContext(ctx) {
  const m = (ctx && ctx.machine) || {};
  return (m.type || 'local') === 'ssh';
}

function contextPath(ctx) {
  return String((ctx && ctx.path) || '').trim();
}

function shortSkillName(name) {
  const s = String(name || '');
  return s.includes('/') ? s.split('/').pop() : s;
}

function skillRepoName(skill) {
  return String((skill && skill.repo) || ((skill && skill.name || '').includes('/') ? skill.name.split('/')[0] : ''));
}

function dedupeSkills(items) {
  const seen = new Set();
  const out = [];
  for (const s of Array.isArray(items) ? items : []) {
    const key = [skillRepoName(s), s && s.name, s && s.commit, s && s.updated, s && s.size].join(' ');
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(s);
  }
  return out;
}

function fmtResultCount(results) {
  const arr = Array.isArray(results) ? results : [];
  const ok = arr.filter(r => r && r.ok).length;
  return `${ok}/${arr.length} ok`;
}

function main() {
  const panel = document;

  const setupSel       = panel.querySelector('#skillm-setup-context');
  const checkBtn       = panel.querySelector('#skillm-check');
  const refreshBtn     = panel.querySelector('#skillm-refresh');
  const tabBtns        = Array.from(panel.querySelectorAll('[data-skillm-tab]'));
  const reposPanel     = panel.querySelector('#skillm-tab-repos');
  const installPanel   = panel.querySelector('#skillm-tab-install');
  const repoAddBtn     = panel.querySelector('#skillm-repo-add');
  const repoEditor     = panel.querySelector('#skillm-repo-editor');
  const repoNameEl     = panel.querySelector('#skillm-repo-name');
  const repoUrlEl      = panel.querySelector('#skillm-repo-url');
  const repoTokenEl    = panel.querySelector('#skillm-repo-token');
  const repoSaveBtn    = panel.querySelector('#skillm-repo-save');
  const repoCancelBtn  = panel.querySelector('#skillm-repo-cancel');
  const repoListEl     = panel.querySelector('#skillm-repo-list');
  const repoFilterEl   = panel.querySelector('#skillm-repo-filter');
  const nodeListEl     = panel.querySelector('#skillm-node-list');
  const nodeScopeBtns  = Array.from(panel.querySelectorAll('[data-node-scope]'));
  const skillSearchEl  = panel.querySelector('#skillm-skill-search');
  const skillListEl    = panel.querySelector('#skillm-skill-list');
  const selectAllBtn   = panel.querySelector('#skillm-skills-all');
  const selectNoneBtn  = panel.querySelector('#skillm-skills-none');
  const scopeSel       = panel.querySelector('#skillm-install-scope');
  const workspaceEl    = panel.querySelector('#skillm-workspace-path');
  const workspaceRow   = workspaceEl ? workspaceEl.closest('label') : null;
  const installBtn     = panel.querySelector('#skillm-install');
  const statusEl       = panel.querySelector('#skillm-status');

  let activeTab = 'repos';
  let repoEditOldName = '';
  let repos = [];
  let skills = [];
  let selectedSkills = new Set();
  let selectedContexts = new Set();
  let nodeScope = 'setup';
  let loading = false;

  try {
    repoNameEl.value = localStorage.getItem(REPO_NAME_KEY) || 'main';
    repoUrlEl.value  = localStorage.getItem(REPO_URL_KEY) || '';
  } catch {
    repoNameEl.value = 'main';
  }

  function contexts() { return state.get('contexts') || []; }
  function selectedContext() { return contexts().find(c => c.name === setupSel.value) || null; }
  function isConnected() { return (state.get('connectionMode') || 'disconnected') !== 'disconnected'; }

  function setStatus(text, cls = '') {
    if (!statusEl) return;
    statusEl.textContent = text || '';
    statusEl.classList.remove('is-error', 'is-ok');
    if (cls) statusEl.classList.add(cls);
  }

  // Toast shim: the iframe has no app toast rail — fold into the status line.
  function showToast(msg, kind) {
    setStatus(msg, kind === 'error' ? 'is-error' : 'is-ok');
  }

  function setLoading(on) {
    loading = !!on;
    syncButtons();
  }

  function syncButtons() {
    const enabled = isConnected() && !!setupSel.value && !loading;
    [checkBtn, refreshBtn, repoAddBtn, repoSaveBtn, installBtn, selectAllBtn, selectNoneBtn].forEach(btn => {
      if (btn) btn.disabled = !enabled;
    });
  }

  function selectedNodeNames() {
    if (nodeScope === 'setup') return [setupSel.value].filter(Boolean);
    if (nodeScope === 'all') return contexts().filter(isSshContext).map(c => c.name);
    const boxes = Array.from(nodeListEl.querySelectorAll('input[type="checkbox"][data-context]'));
    return boxes.filter(b => b.checked).map(b => b.dataset.context).filter(Boolean);
  }

  function selectedAgentTools() {
    return AGENT_TOOLS.filter(t => {
      const el = panel.querySelector(`#skillm-agent-${t}`);
      return el && el.checked;
    });
  }

  function setTab(tab) {
    activeTab = tab === 'install' ? 'install' : 'repos';
    for (const btn of tabBtns) {
      const on = btn.dataset.skillmTab === activeTab;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    }
    reposPanel.hidden = activeTab !== 'repos';
    installPanel.hidden = activeTab !== 'install';
    if (activeTab === 'install') void loadSkills({ sync: true });
  }

  function renderContextOptions() {
    const ctxs = contexts();
    const prev = setupSel.value;
    setupSel.innerHTML = '<option value="">Select SSH node...</option>' + ctxs.map(c => {
      const disabled = isSshContext(c) ? '' : ' disabled';
      return `<option value="${esc(c.name)}"${disabled}>${esc(machineLabel(c))}</option>`;
    }).join('');
    if (prev && ctxs.some(c => c.name === prev && isSshContext(c))) setupSel.value = prev;
    else {
      const first = ctxs.find(isSshContext);
      if (first) setupSel.value = first.name;
    }
    const ctx = selectedContext();
    if (ctx && !workspaceEl.value) workspaceEl.value = contextPath(ctx);
    if (setupSel.value && !selectedContexts.size) selectedContexts.add(setupSel.value);
    renderNodeList();
    syncButtons();
  }

  function renderRepoFilter() {
    const prev = repoFilterEl.value || 'all';
    repoFilterEl.innerHTML = '<option value="all">All repositories</option>' + repos.map(r => `<option value="${esc(r.name)}">${esc(r.name)}</option>`).join('');
    repoFilterEl.value = repos.some(r => r.name === prev) ? prev : 'all';
  }

  function renderRepos() {
    renderRepoFilter();
    if (!repos.length) {
      repoListEl.innerHTML = '<div class="empty-state">No repositories yet. Add a repository to initialize this node.</div>';
      return;
    }
    repoListEl.innerHTML = repos.map((r) => {
      const active = r.active ? '<span class="skillm-repo-badge">active</span>' : '';
      const local = r.local ? '<span class="skillm-repo-badge">local</span>' : '';
      return `<div class="skillm-repo-row" data-repo="${esc(r.name)}">
        <div class="skillm-repo-main">
          <span class="skillm-repo-name">${esc(r.name)} ${active} ${local}</span>
          <span class="skillm-repo-url">${esc(r.url || '(local repository)')}</span>
        </div>
        <div class="skillm-repo-actions">
          <button type="button" class="btn-secondary" data-repo-action="refresh">Refresh</button>
          <button type="button" class="btn-secondary" data-repo-action="edit">Edit</button>
          <button type="button" class="btn-secondary btn-danger-lite" data-repo-action="remove">Remove</button>
        </div>
      </div>`;
    }).join('');
  }

  function renderNodeList() {
    const ctxs = contexts();
    for (const c of ctxs) if (selectedContexts.size === 0 && c.name === setupSel.value) selectedContexts.add(c.name);
    nodeScopeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.nodeScope === nodeScope));
    if (nodeScope !== 'selected') {
      const label = nodeScope === 'all' ? 'All SSH nodes will receive the selected skills.' : 'Only the setup node will receive the selected skills.';
      nodeListEl.innerHTML = `<div class="empty-state">${esc(label)}</div>`;
      return;
    }
    if (!ctxs.length) {
      nodeListEl.innerHTML = '<div class="empty-state">No contexts yet. Add hosts in Nodes first.</div>';
      return;
    }
    nodeListEl.innerHTML = ctxs.map(c => {
      const ssh = isSshContext(c);
      const checked = selectedContexts.has(c.name) || c.name === setupSel.value;
      const disabled = ssh ? '' : ' disabled';
      return `<label class="skillm-node-row ${ssh ? '' : 'is-disabled'}">
        <input type="checkbox" data-context="${esc(c.name)}"${checked ? ' checked' : ''}${disabled}>
        <span class="skillm-node-main">
          <span class="skillm-node-name">${esc(c.name)}</span>
          <span class="skillm-node-meta">${esc(machineLabel(c))}</span>
        </span>
        <span class="skillm-node-path">${esc(contextPath(c) || '-')}</span>
      </label>`;
    }).join('');
  }

  function filteredSkills() {
    const q = (skillSearchEl.value || '').trim().toLowerCase();
    const repo = repoFilterEl.value || 'all';
    return skills.filter(s => {
      if (repo !== 'all' && skillRepoName(s) !== repo) return false;
      if (!q) return true;
      const hay = [s.name, skillRepoName(s), s.category, (s.tags || []).join(' '), s.commit].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  function syncScopeVisibility() {
    if (workspaceRow) workspaceRow.hidden = scopeSel.value !== 'workspace';
  }

  function renderSkills() {
    const list = filteredSkills();
    if (!skills.length) {
      skillListEl.innerHTML = '<div class="empty-state">Open Install to refresh repositories and load skills.</div>';
      return;
    }
    if (!list.length) {
      skillListEl.innerHTML = '<div class="empty-state">No skills match this filter.</div>';
      return;
    }
    skillListEl.innerHTML = list.map(s => {
      const name = s.name || '';
      const tags = Array.isArray(s.tags) ? s.tags : [];
      const repo = skillRepoName(s) || 'repo';
      return `<label class="skillm-skill-row">
        <input type="checkbox" data-skill="${esc(name)}"${selectedSkills.has(name) ? ' checked' : ''}>
        <span class="skillm-skill-main">
          <span class="skillm-skill-name">${esc(shortSkillName(name))}</span>
          <span class="skillm-skill-full">${esc(name)}</span>
        </span>
        <span class="skillm-skill-tags"><span>${esc(repo)}</span>${tags.map(t => `<span>#${esc(t)}</span>`).join('')}</span>
        <span class="skillm-skill-meta">${esc(s.updated || '')}${s.size ? ' - ' + esc(s.size) : ''}</span>
      </label>`;
    }).join('');
  }

  function showRepoEditor(repo = null) {
    repoEditOldName = repo ? repo.name : '';
    repoNameEl.value = repo ? repo.name : (localStorage.getItem(REPO_NAME_KEY) || 'main');
    repoUrlEl.value = repo ? (repo.url || '') : (localStorage.getItem(REPO_URL_KEY) || '');
    repoTokenEl.value = '';
    repoEditor.hidden = false;
    repoNameEl.focus();
  }

  function hideRepoEditor() {
    repoEditOldName = '';
    repoTokenEl.value = '';
    repoEditor.hidden = true;
  }

  async function loadRepos() {
    const ctx = setupSel.value;
    if (!ctx) return;
    setLoading(true);
    setStatus('Loading repositories...');
    try {
      const res = await api.skillmRepos(ctx);
      repos = Array.isArray(res.repos) ? res.repos : [];
      renderRepos();
      setStatus(`Loaded ${repos.length} repository record(s).`, 'is-ok');
    } catch (err) {
      const msg = err && err.message || String(err);
      setStatus(`Repository list failed: ${msg}`, 'is-error');
      showToast(`Repository list failed: ${msg}`, 'error');
    } finally {
      setLoading(false);
    }
  }

  async function loadSkills({ sync = false } = {}) {
    const ctx = setupSel.value;
    if (!ctx) return;
    setLoading(true);
    setStatus(sync ? 'Refreshing repositories and loading skills...' : 'Loading skills...');
    try {
      const repoName = repoFilterEl.value || 'all';
      const res = await api.skillmList(ctx, { repoName, sync });
      skills = dedupeSkills(res.skills);
      selectedSkills = new Set([...selectedSkills].filter(s => skills.some(x => x.name === s)));
      renderSkills();
      setStatus(`Loaded ${skills.length} skill(s) from ${repoName === 'all' ? 'all repositories' : repoName}.`, 'is-ok');
    } catch (err) {
      const msg = err && err.message || String(err);
      setStatus(`Skill list failed: ${msg}`, 'is-error');
      showToast(`Skill list failed: ${msg}`, 'error');
    } finally {
      setLoading(false);
    }
  }

  checkBtn.addEventListener('click', async () => {
    if (!setupSel.value) return;
    setLoading(true);
    setStatus('Checking skillm...');
    try {
      const res = await api.skillmStatus(setupSel.value);
      if (res.installed) setStatus(`Skillm ready on ${setupSel.value}${res.version ? ': ' + res.version : ''}.`, 'is-ok');
      else setStatus(`Skillm missing on ${setupSel.value}: ${res.detail || res.error || 'not found'}`, 'is-error');
    } catch (err) {
      setStatus(`Check failed: ${err && err.message || err}`, 'is-error');
    } finally {
      setLoading(false);
    }
  });

  refreshBtn.addEventListener('click', async () => {
    // Also re-read contexts — the iframe view has no live state subscription,
    // so Refresh is how newly added nodes become visible.
    await loadContexts();
    if (!_connected) {
      setStatus('Not connected — connect the app first, then click Refresh.', 'is-error');
      renderContextOptions();
      return;
    }
    renderContextOptions();
    if (activeTab === 'repos') await loadRepos();
    else await loadSkills({ sync: true });
  });

  tabBtns.forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.skillmTab)));
  repoAddBtn.addEventListener('click', () => showRepoEditor(null));
  repoCancelBtn.addEventListener('click', hideRepoEditor);

  repoSaveBtn.addEventListener('click', async () => {
    const body = {
      contextName: setupSel.value,
      oldName: repoEditOldName,
      repoName: (repoNameEl.value || '').trim(),
      repoUrl: (repoUrlEl.value || '').trim(),
      token: repoTokenEl.value || '',
    };
    if (!body.contextName || !body.repoName || !body.repoUrl) {
      setStatus('Pick a node and provide repository name + URL.', 'is-error');
      return;
    }
    setLoading(true);
    setStatus(repoEditOldName ? `Updating repository ${repoEditOldName}...` : `Adding repository ${body.repoName}...`);
    try {
      localStorage.setItem(REPO_NAME_KEY, body.repoName);
      localStorage.setItem(REPO_URL_KEY, body.repoUrl);
      const res = repoEditOldName ? await api.skillmRepoUpdate(body) : await api.skillmRepoAdd(body);
      const ok = res.ok !== false;
      setStatus(ok ? `Repository ${body.repoName} ready.` : `Repository warning: ${res.detail || res.error}`, ok ? 'is-ok' : 'is-error');
      showToast(ok ? 'Repository ready' : 'Repository warning', ok ? 'success' : 'warning');
      hideRepoEditor();
      await loadRepos();
      await loadSkills({ sync: false });
    } catch (err) {
      const msg = err && err.message || String(err);
      setStatus(`Repository save failed: ${msg}`, 'is-error');
      showToast(`Repository save failed: ${msg}`, 'error');
    } finally {
      repoTokenEl.value = '';
      setLoading(false);
    }
  });

  repoListEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-repo-action]');
    const row = e.target.closest('[data-repo]');
    if (!btn || !row) return;
    const repo = repos.find(r => r.name === row.dataset.repo);
    if (!repo) return;
    if (btn.dataset.repoAction === 'edit') return showRepoEditor(repo);
    if (btn.dataset.repoAction === 'remove') {
      // Sandboxed iframe: no window.confirm (allow-modals is not granted).
      // Two-step armed button instead.
      if (btn.dataset.armed !== '1') {
        btn.dataset.armed = '1';
        btn.textContent = 'Sure?';
        setStatus(`Click "Sure?" to confirm removing ${repo.name} from ${setupSel.value}.`);
        setTimeout(() => { btn.dataset.armed = ''; btn.textContent = 'Remove'; }, 3000);
        return;
      }
      btn.dataset.armed = '';
      btn.textContent = 'Remove';
      setLoading(true);
      setStatus(`Removing repository ${repo.name}...`);
      try {
        const res = await api.skillmRepoRemove({ contextName: setupSel.value, repoName: repo.name });
        setStatus(res.ok === false ? `Remove warning: ${res.detail || res.error}` : `Repository ${repo.name} removed.`, res.ok === false ? 'is-error' : 'is-ok');
        await loadRepos();
        await loadSkills({ sync: false });
      } catch (err) {
        setStatus(`Remove failed: ${err && err.message || err}`, 'is-error');
      } finally {
        setLoading(false);
      }
      return;
    }
    if (btn.dataset.repoAction === 'refresh') {
      setLoading(true);
      setStatus(`Refreshing ${repo.name}...`);
      try {
        const res = await api.skillmRepoRefresh({ contextName: setupSel.value, repoName: repo.name });
        const summary = fmtResultCount(res.results);
        setStatus(`Refresh complete: ${summary}.`, res.ok === false ? 'is-error' : 'is-ok');
        await loadSkills({ sync: false });
      } catch (err) {
        setStatus(`Refresh failed: ${err && err.message || err}`, 'is-error');
      } finally {
        setLoading(false);
      }
    }
  });

  nodeScopeBtns.forEach(btn => btn.addEventListener('click', () => {
    nodeScope = btn.dataset.nodeScope || 'setup';
    renderNodeList();
  }));
  nodeListEl.addEventListener('change', (e) => {
    const box = e.target.closest('input[type="checkbox"][data-context]');
    if (!box) return;
    if (box.checked) selectedContexts.add(box.dataset.context);
    else selectedContexts.delete(box.dataset.context);
  });

  skillSearchEl.addEventListener('input', renderSkills);
  repoFilterEl.addEventListener('change', () => { void loadSkills({ sync: true }); });
  scopeSel.addEventListener('change', syncScopeVisibility);
  skillListEl.addEventListener('change', (e) => {
    const box = e.target.closest('input[type="checkbox"][data-skill]');
    if (!box) return;
    if (box.checked) selectedSkills.add(box.dataset.skill);
    else selectedSkills.delete(box.dataset.skill);
  });
  selectAllBtn.addEventListener('click', () => {
    for (const s of filteredSkills()) selectedSkills.add(s.name);
    renderSkills();
  });
  selectNoneBtn.addEventListener('click', () => {
    selectedSkills.clear();
    renderSkills();
  });

  setupSel.addEventListener('change', async () => {
    const ctx = selectedContext();
    if (ctx) {
      selectedContexts.add(ctx.name);
      workspaceEl.value = contextPath(ctx);
    }
    renderNodeList();
    await loadRepos();
    if (activeTab === 'install') await loadSkills({ sync: true });
    syncButtons();
  });

  installBtn.addEventListener('click', async () => {
    const names = [...selectedSkills];
    const nodes = selectedNodeNames();
    const tools = selectedAgentTools();
    if (!names.length) return setStatus('Select at least one skill.', 'is-error');
    if (!nodes.length) return setStatus('Select at least one SSH node.', 'is-error');
    if (!tools.length) return setStatus('Select at least one agent CLI.', 'is-error');
    const scope = scopeSel.value === 'workspace' ? 'workspace' : 'global';
    const workspacePath = (workspaceEl.value || '').trim();
    if (scope === 'workspace' && !workspacePath) return setStatus('Workspace install requires a workspace path.', 'is-error');
    setLoading(true);
    setStatus(`Refreshing repositories and installing ${names.length} skill(s) on ${nodes.length} node(s)...`);
    try {
      const repoName = repoFilterEl.value || 'all';
      const res = await api.skillmInstall({ contexts: nodes, skills: names, agents: tools, scope, workspacePath, repoName });
      const summary = fmtResultCount(res.results);
      const ok = res.results && res.results.every(r => r.ok);
      setStatus(`Install complete: ${summary}.`, ok ? 'is-ok' : 'is-error');
      showToast(`Skill install: ${summary}`, ok ? 'success' : 'warning');
    } catch (err) {
      const msg = err && err.message || String(err);
      setStatus(`Install failed: ${msg}`, 'is-error');
      showToast(`Install failed: ${msg}`, 'error');
    } finally {
      setLoading(false);
    }
  });

  // Initial render (empty until boot()'s contexts read lands and re-renders
  // via the Refresh path).
  renderContextOptions();
  renderRepos();
  renderSkills();
  syncScopeVisibility();
  syncButtons();
}

/* Boot: read contexts via the bridge, then drive the initial load through
 * the same path as the Refresh button. A failure means the app is not
 * connected — show the empty state and let Refresh retry. */
async function loadContexts() {
  try {
    const r = await camExt.call('contexts.list');
    _contexts = Array.isArray(r) ? r : (r && r.contexts) || [];
    _connected = true;
  } catch (_) {
    _contexts = [];
    _connected = false;
  }
}

(async function boot() {
  main();
  await loadContexts();
  if (!_connected) {
    const statusEl = document.querySelector('#skillm-status');
    if (statusEl) {
      statusEl.textContent = 'Not connected — connect the app first, then click Refresh.';
      statusEl.classList.add('is-error');
    }
    return;
  }
  document.querySelector('#skillm-refresh').click();
})();
</script>
</body>
</html>

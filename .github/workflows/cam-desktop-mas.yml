name: CAM Desktop — Mac App Store (mas pkg)

# Spike build for the Mac App Store track: signed mas .pkg with sandbox
# entitlements. Secrets: MAS_APP_CSC_LINK (base64 p12 of the Apple
# Distribution / "3rd Party Mac Developer Application" cert+key),
# MAS_INSTALLER_CSC_LINK (base64 p12 of the Mac Installer Distribution /
# "3rd Party Mac Developer Installer" cert+key), MAS_CSC_KEY_PASSWORD
# (shared p12 password), MAS_PROVISIONING_PROFILE (base64 of the
# .provisionprofile for com.hren.cam.mas). Two separate p12s because
# openssl/electron-builder can only carry one key per p12; both are
# imported into a temp keychain below. NOT notarized — MAS packages are
# reviewed by App Store Connect, not notarized.

on:
  workflow_dispatch:
  push:
    tags:
      - 'cam-desktop-mas-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mas-pkg:
    name: Build signed mas pkg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
    defaults:
      run:
        working-directory: apps/cam-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/cam-desktop/package-lock.json

      - name: Write provisioning profile
        env:
          PROFILE_B64: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$PROFILE_B64" ]; then
            echo "::error::MAS_PROVISIONING_PROFILE secret is empty — export the com.hren.cam MAS provisioning profile from App Store Connect and base64 it into the secret."
            exit 1
          fi
          printf '%s' "$PROFILE_B64" | base64 -d > embedded.provisionprofile
          ls -la embedded.provisionprofile

      - name: Install npm dependencies
        run: npm ci

      - name: Syntax check Electron entrypoints
        run: npm run lint:electron

      - name: Import MAS signing certificates
        env:
          APP_P12_B64: ${{ secrets.MAS_APP_CSC_LINK }}
          INSTALLER_P12_B64: ${{ secrets.MAS_INSTALLER_CSC_LINK }}
          P12_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$APP_P12_B64" | base64 -d > /tmp/mas-app.p12
          printf '%s' "$INSTALLER_P12_B64" | base64 -d > /tmp/mas-installer.p12
          KC=build-mas.keychain-db
          KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import /tmp/mas-app.p12 -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security import /tmp/mas-installer.p12 -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed -e 's/"//g')
          security default-keychain -d user -s "$KC"
          security find-identity -v -p codesigning "$KC"
          rm -f /tmp/mas-app.p12 /tmp/mas-installer.p12

      - name: Build signed mas pkg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: npm run build:mas

      - name: Upload mas pkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: cam-desktop-mas-${{ matrix.arch }}-pkg
          path: apps/cam-desktop/dist/*.pkg
          if-no-files-found: error

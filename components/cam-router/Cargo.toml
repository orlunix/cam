[workspace]
members = ["crates/cam-protocol", "crates/cam-server", "crates/cam-tui"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.71"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
tokio = { version = "=1.35.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "process"] }
rusqlite = { version = "=0.30.0", features = ["bundled"] }
sha2 = "=0.10.8"
uuid = { version = "=1.6.1", features = ["v4"] }
chrono = { version = "=0.4.31", default-features = false, features = ["std"] }
libc = "=0.2.169"
fs2 = "=0.4.3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

name: Cam Desktop — Windows MSI

# Single-installer Windows release for Cam Desktop (Electron +
# electron-builder). Produces exactly one .msi artifact.

on:
  push:
    tags:
      - 'cam-desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/cam-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/cam-desktop/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Syntax check Electron entrypoints
        run: npm run lint:electron

      - name: Build single MSI installer
        run: npm run build:win-msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: cam-desktop-windows-msi
          path: apps/cam-desktop/dist/*.msi
          if-no-files-found: error

      - name: Attach MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "CAM Desktop ${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" apps/cam-desktop/dist/*.msi --clobber

# Cursor Agent boot — workspace trust during initializing only.

[adapter]
name = "cursor"
cursor_flag_support = false

[launch]
startup_wait = 15.0
strip_ansi = true
ready_pattern = "→"
ready_flags = ["MULTILINE"]

[[confirm]]
pattern = "^[ \\t]*▶[ \\t]*\\[a\\][ \\t]*Trust this workspace"
flags = ["MULTILINE"]
response = ""
send_enter = true

[monitor]
confirm_recent_lines = 128

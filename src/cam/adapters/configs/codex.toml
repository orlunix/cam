# Codex adapter — interactive mode.
# Auto-confirm handles the initial trust dialog and approval prompts.
#
# TUI markers:
#   Input prompt:  › (start of line)
#   Working:       • Thinking / Exploring / etc.

[adapter]
name = "codex"
display_name = "OpenAI Codex"
config_dir = ".codex"
isolate_tool_home = true

# Every Codex agent gets the same thin overlay. The donor remains ~/.codex;
# shared state is linked while config.toml is snapshotted per agent. Runtime
# paths whose locking/janitor semantics require a host-local filesystem are
# redirected before Codex starts, including on a --tool-launcher target.
[runtime]
environment = "CODEX_HOME"
shared_home = "~/.codex"
local_links = ["tmp/arg0=/tmp/{user}/codex-arg0"]
config_local_dirs = ["sqlite_home"]
prune_path_links = ["tmp/arg0"]
clear_environment = ["CODEX_SQLITE_HOME"]

# Login and API runs use this same overlay. API profiles only add their
# provider/catalog settings to the overlay's private config snapshot.
[runtime.overlay]
root = "~/.codex"
config_file = "config.toml"
config_format = "codex"
wire_api = "responses"
catalog_file = "camc-model-catalog.json"
shared = ["auth.json", "skills", "skills.json", "mcp.json", "mcp.toml", "mcp.yaml", "mcp.yml", "hooks.json"]
shared_globs = ["*"]
# Daemon sockets and locks belong to this agent, especially across LSF hosts.
shared_exclude = ["tmp", "config.toml", "camc-model-catalog.json", "app-server-control", "app-server-daemon"]

[runtime.overlay.config_boolean_overrides]
# Managed agents must not offer npm installation in a remote resume menu.
check_for_update_on_startup = false

[runtime.overlay.launcher_config_boolean_overrides]
# Remote command shells must retain the resolved allocation environment.
allow_login_shell = false

[launch]
# Keep Codex in the normal screen so tmux/terminal scrollback retains output.
# --no-alt-screen is supported by current Codex builds; older builds that
# reject it will fail readiness and need an upgrade.
command = ["codex", "--no-alt-screen"]
trust_workspace = true
# Used by every managed launch, including explicit local execution.
launcher_autorun_args = ["--yolo"]
prompt_after_launch = true
startup_wait = 20.0
# 2026-06-23 PDX hotfix: include U+276F ❯ in addition to U+203A ›
# and ASCII '>'. Some Codex builds render the input prompt with ❯,
# others with ›. Accept all three so the launch loop sees readiness
# regardless of the build variant. The character class is anchored
# at line start so unrelated prose can't false-trigger.
ready_pattern = "^[❯›>]"
ready_flags = ["MULTILINE"]
prompt_submit_delay = 0.5

[[confirm]]
# Numbered menu — cursor at line start, then "1. Yes, ...".
# The comma distinguishes the menu from a user's stable input such as
# "1. yes it is".
pattern = "^›\\s+1\\.\\s*Yes,\\s+.*$"
flags = ["IGNORECASE", "MULTILINE"]
response = "1"
send_enter = false

[[confirm]]
# Some Codex builds omit the active cursor marker from captured menus.
# A stable third "No" option still identifies the approval menu; accept by
# selecting option 1.
pattern = "^\\s*3\\.\\s*No,.*$"
flags = ["IGNORECASE", "MULTILINE"]
response = "1"
send_enter = false

# (2026-06-11 hot-fix) The generic bracket-y/n rule
#   "\[Y/n\]|\[y/N\]"
# was REMOVED — modern codex uses numbered menus handled by the
# rules above. The legacy rule false-fired on prose / scrollback
# containing the literal bracket token. The new global input-cursor
# guard in src/camc_pkg/detection.py is a second layer of defense.

[monitor]
# Codex shows "• Working (7s • esc to interrupt)" while busy
busy_pattern = "Working \\(\\d+s"
confirm_cooldown = 5.0
confirm_recent_lines = 128
confirm_sleep = 0.5
health_check_interval = 15
idle_stable_seconds = 60      # normalized-content hash0 stable this long -> idle
auto_exit = false             # finalize agent when task completes and idle confirmed
exit_action = "kill_session"  # "kill_session", "send_exit", or "mark_only"
exit_command = "/exit"        # command to send if exit_action = "send_exit"

# Adapter-owned readiness (F-08). Codex auth is soft: any one of the
# alternatives below passes; complete miss is a WARN not a block,
# because the canonical auth path varies across deployments.
[readiness]
binary = "codex"
version_args = ["--version"]
version_required = true
install_hint = "npm install -g @openai/codex"

[[readiness.optional_files]]
path = "~/.codex/auth.json"

[[readiness.optional_files]]
path = "~/.codex/config.toml"

[[readiness.optional_env]]
name = "OPENAI_API_KEY"

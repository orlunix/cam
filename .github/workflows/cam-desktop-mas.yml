name: CAM Desktop — Mac App Store (mas pkg)

# Spike build for the Mac App Store track: signed mas .pkg with sandbox
# entitlements. Secrets: MAS_APP_PEM / MAS_INSTALLER_PEM (base64 of plain
# PEM = cert + private key for the Apple Distribution and Mac Installer
# Distribution identities; PEM because macOS `security import` rejects
# openssl-produced p12 files), MAS_PROVISIONING_PROFILE (base64 of the
# .provisionprofile for com.hren.cam.mas). NOT notarized — MAS packages
# are reviewed by App Store Connect, not notarized.

on:
  workflow_dispatch:
  push:
    tags:
      - 'cam-desktop-mas-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mas-pkg:
    name: Build signed mas pkg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
    defaults:
      run:
        working-directory: apps/cam-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/cam-desktop/package-lock.json

      - name: Write provisioning profile
        env:
          PROFILE_B64: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$PROFILE_B64" ]; then
            echo "::error::MAS_PROVISIONING_PROFILE secret is empty — export the com.hren.cam MAS provisioning profile from App Store Connect and base64 it into the secret."
            exit 1
          fi
          printf '%s' "$PROFILE_B64" | base64 -d > embedded.provisionprofile
          ls -la embedded.provisionprofile

      - name: Install npm dependencies
        run: npm ci

      - name: Syntax check Electron entrypoints
        run: npm run lint:electron

      - name: Import MAS signing certificates
        env:
          APP_PEM_B64: ${{ secrets.MAS_APP_PEM }}
          INSTALLER_PEM_B64: ${{ secrets.MAS_INSTALLER_PEM }}
        run: |
          set -euo pipefail
          # PEM (cert + private key) import — macOS `security` rejects
          # openssl-3-produced p12 files ("Unknown format in import") and
          # legacy RC2 p12s, so the identities travel as plain PEM instead.
          printf '%s' "$APP_PEM_B64" | base64 -d > /tmp/mas-app.pem
          printf '%s' "$INSTALLER_PEM_B64" | base64 -d > /tmp/mas-installer.pem
          openssl x509 -in /tmp/mas-app.pem -noout -subject
          openssl x509 -in /tmp/mas-installer.pem -noout -subject
          KC=build-mas.keychain-db
          KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import /tmp/mas-app.pem -k "$KC" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security import /tmp/mas-installer.pem -k "$KC" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          # productbuild (pkg signing) is not codesign: it needs its own
          # partition id, otherwise it blocks forever on an unanswerable
          # GUI key-access prompt (the 25-min hang fixed here).
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild:,security: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed -e 's/"//g')
          security default-keychain -d user -s "$KC"
          security find-identity -v -p codesigning "$KC"
          rm -f /tmp/mas-app.pem /tmp/mas-installer.pem

      - name: Build signed mas pkg
        timeout-minutes: 25
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
          DEBUG: 'electron-osx-sign,electron-builder'
        run: npm run build:mas

      - name: Upload mas pkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: cam-desktop-mas-${{ matrix.arch }}-pkg
          path: apps/cam-desktop/dist/**/*.pkg
          if-no-files-found: error
